<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Password Reset</title>
    
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body>
    <h1 class="mt-8 text-left px-8 text-4xl font-bold tracking-tight text-blue-500"><a href="/">TechForge</a></h1>

    <div class="flex min-h-full flex-col justify-center px-6 py-12 lg:px-8">
        <div class="sm:mx-auto sm:w-full sm:max-w-sm">
            <h2 class="mt-2 text-center text-2xl font-bold tracking-tight text-gray-900">Enter new password</h2>
        </div>
        
        <div class="mt-10 sm:mx-auto sm:w-full sm:max-w-sm">
            <form method="post" action="">
                {% csrf_token %}
                
                {% if form.errors %}
                    <div class="text-red-500 text-sm mb-4">
                        <ul>
                            {% for field in form %}
                                {% for error in field.errors %}
                                    <li>{{ error }}</li>
                                {% endfor %}
                            {% endfor %}
                            {% for error in form.non_field_errors %}
                                <li>{{ error }}</li>
                            {% endfor %}
                        </ul>
                    </div>
                {% endif %}
                
                <div>
                    <label for="new_password1" class="block text-sm font-medium text-gray-900">New Password</label>
                    <div class="mt-2">
                        <input type="password" name="new_password1" id="new_password1" autocomplete="new-password" required 
                            class="block w-full border-2 rounded-md bg-white px-3 py-1.5 text-base text-gray-900 
                            outline-1 -outline-offset-1 outline-gray-300 placeholder:text-gray-400 focus:outline-2 
                            focus:-outline-offset-2 focus:outline-indigo-600 sm:text-sm">
                    </div>
                </div>

                <div class="mt-2 mb-10">
                    <label for="new_password2" class="block text-sm font-medium text-gray-900">Confirm New Password</label>
                    <div class="mt-2">
                        <input type="password" name="new_password2" id="new_password2" autocomplete="new-password" required 
                            class="block w-full border-2 rounded-md bg-white px-3 py-1.5 text-base text-gray-900 
                            outline-1 -outline-offset-1 outline-gray-300 placeholder:text-gray-400 focus:outline-2 
                            focus:-outline-offset-2 focus:outline-indigo-600 sm:text-sm">
                    </div>
                </div>

                <div>
                    <button type="submit" class="flex w-full justify-center rounded-md bg-indigo-600 px-3 py-1.5 
                        text-sm font-semibold text-white shadow-xs hover:bg-indigo-500 focus-visible:outline-2 
                        focus-visible:outline-offset-2 focus-visible:outline-indigo-600">Change Password</button>
                </div>
            </form>
        </div>
    </div>
</body>
</html>
