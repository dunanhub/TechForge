<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Confirm Your Email</title>
</head>
<body style="font-family: Arial, sans-serif; background-color: #f4f4f4; margin: 0; padding: 0;">
    <div style="max-width: 600px; margin: 30px auto; background: #ffffff; padding: 20px; border-radius: 8px; box-shadow: 0px 0px 10px rgba(0, 0, 0, 0.1);">
        <div style="text-align: center; font-size: 24px; font-weight: bold; color: #333;">Welcome to TechForge!</div>
        <p style="font-size: 16px; color: #555; line-height: 1.5; text-align: center;">
            Hi {{ user.username }},<br>
            Thank you for registering at TechForge! To complete your registration, please confirm your email by clicking the button below:
        </p>
        <div style="text-align: center; margin: 20px 0;">
            <a href="http://{{ domain }}/auth/activate/{{ uid }}/{{ token }}/" style="display: inline-block; padding: 12px 20px; font-size: 16px; color: #ffffff; background-color: #007bff; text-decoration: none; border-radius: 5px; font-weight: bold;">Confirm Email</a>
        </div>
        <p style="font-size: 16px; color: #555; line-height: 1.5; text-align: center;">
            If you didn’t request this, you can safely ignore this email.
        </p>
        <div style="text-align: center; font-size: 12px; color: #999; margin-top: 20px;">
            &copy; 2025 TechForge. All rights reserved.
        </div>
    </div>
</body>
</html>
