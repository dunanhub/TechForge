<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - TechForge</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 flex items-center justify-center h-screen">
    <div class="bg-white p-8 rounded-lg shadow-lg w-96">
        <h2 class="text-2xl font-bold text-center mb-4">Sign In</h2>
        {% if error %}
            <p class="text-red-500 text-center">{{ error }}</p>
        {% endif %}
        
        <form method="POST">
            {% csrf_token %}
            <input type="text" name="username" placeholder="Username" class="w-full px-4 py-2 border rounded-lg mb-2">
            <input type="password" name="password" placeholder="Password" class="w-full px-4 py-2 border rounded-lg mb-2">
            <button type="submit" class="w-full bg-blue-600 text-white px-4 py-2 rounded-lg">Login</button>
        </form>
        <p class="text-center mt-4">Don't have an account? <a href="/signup/" class="text-blue-600">Sign up</a></p>
    </div>
</body>
</html>
