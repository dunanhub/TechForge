{% extends 'base.html' %}
{% load static %}
{% block content %}
<section class="py-12 font-sans">
    <div class="container mx-auto px-4">
        <h2 class="text-3xl font-bold text-center mb-8">{{ subcategory.name }}</h2>
        <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-8">
            {% for product in products %}
            <div class="bg-white shadow-md rounded-lg overflow-hidden">
                <a href="{% url 'products:product_detail' category.id subcategory.id product.id %}">
                {% if product.images.first %}
                    <img src="{{ product.images.first.image.url }}" alt="{{ product.name }}" class="w-full h-70 object-cover">
                {% else %}
                    <img src="{% static 'images/product_placeholder.png' %}" alt="{{ product.name }}" class="w-full h-auto object-cover">
                {% endif %}
                <div class="p-4">
                    <h3 class="text-xl font-bold">{{ product.name }}</h3>
                    <p class="mt-2 text-gray-600">{{ product.description }}</p>
                    <p class="mt-2 text-gray-800 font-bold">{{ product.price }} KZT</p>
                    <div class="mt-6">
                        <button onclick="addToCart({{ product.id }})" class="bg-blue-500 text-white px-6 py-2 rounded-md hover:bg-blue-600">Добавить в корзину</button>
                    </div>
                </div>
            </div>
            {% endfor %}
        </div>
    </div>
</section>
<script>
function addToCart(productId) {
    fetch(`/orders/add-to-cart/${productId}/`, {
        method: 'POST',
        headers: {
            'X-CSRFToken': '{{ csrf_token }}',
            'Content-Type': 'application/json',
        },
    })
    .then(response => {
        if (!response.ok) {
            throw new Error('Network response was not ok');
        }
        return response.json();
    })
    .then(data => {
            if (data.success) {
                window.location.reload();
                alert ('Товар успешно добавлен в корзину.');
            } else {
                alert('Ошибка при добавлении товара: ' + data.error);
            }
        })
        .catch(error => {
            console.error('Error:', error);
            alert('Произошла ошибка при добавлении товара в корзину.');
        });
}
</script>
{% endblock %}
