{% extends 'base.html' %}
{% load static %}

{% block content %}
<section class="py-12 font-sans">
    <div class="container mx-auto px-4">
        <h2 class="text-3xl font-bold text-center mb-8">Категории</h2>
        <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-8">
            {% for category in categories %}
            <div class="bg-white shadow-md rounded-lg overflow-hidden">
                <a href="{% url 'products:subcategory_by_category' category.id %}">
                    <div class="p-4">
                        <h3 class="text-xl font-bold text-center">{{ category.name }}</h3>
                        {% if category.image and category.image.url %}
                            <img src="{{ category.image.url }}" alt="{{ category.name }}" class="w-full h-auto object-cover mt-4">
                        {% else %}
                            <img src="{% static 'images/category_placeholder.png' %}" alt="{{ category.name }}" class="w-full h-48 object-cover mt-4">
                        {% endif %}
                    </div>
                </a>
            </div>
            {% endfor %}
        </div>
    </div>
</section>
{% endblock %}
