{% extends 'base.html' %}

{% block content %}
<section class="py-12 bg-gray-100">
    <div class="container mx-auto px-4">
        <div class="bg-white shadow-md rounded-lg overflow-hidden">
            <img src="{{ product.image.url }}" alt="{{ product.name }}" class="w-full h-auto object-cover">
            <div class="p-4">
                <h3 class="text-2xl font-bold">{{ product.name }}</h3>
                <p class="mt-2 text-gray-600">{{ product.description }}</p>
                <p class="mt-2 text-gray-800 font-bold">{{ product.price }} USD</p>
                <p class="mt-2 text-gray-800 font-bold">Stock: {{ product.stock }}</p>
                <p class="mt-2 text-gray-800 font-bold">Category: {{ product.category.name }}</p>
            </div>
        </div>
    </div>
</section>
{% endblock %}
