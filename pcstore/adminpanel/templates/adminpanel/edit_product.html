{% extends 'admin.html' %}

{% load crispy_forms_tags %}

{% block content %}
<section class="py-12 bg-gray-100 font-sans">
    <div class="container mx-auto px-4">
        <h2 class="text-3xl font-bold text-center mb-8">Edit Product</h2>
        <form method="post" enctype="multipart/form-data" class="max-w-lg mx-auto bg-white p-6 rounded-lg shadow-md">
            {% csrf_token %}
            {{ form|crispy }}
            <div class="mt-4">
                {{ formset.management_form }}
                {% for form in formset %}
                    {{ form.image.label_tag }}<br>
                    {{ form.image }}
                {% endfor %}
            </div>
            <button type="submit" class="mt-4 bg-blue-500 text-white px-6 py-2 rounded-md hover:bg-blue-600">Save Changes</button>
        </form>
    </div>
</section>
{% endblock %}
