{% extends 'admin.html' %}

{% block content %}
<section class="py-12 bg-gray-100">
    <div class="container mx-auto px-4">
        <h2 class="text-3xl font-bold text-center mb-8">Delete Category</h2>
        <p class="text-center text-gray-700">Are you sure you want to delete the category "{{ category.name }}"?</p>
        <form method="post" class="max-w-lg mx-auto bg-white p-6 rounded-lg shadow-md text-center">
            {% csrf_token %}
            <button type="submit" class="mt-4 bg-red-500 text-white px-6 py-2 rounded-md hover:bg-red-600">Yes, Delete</button>
            <a href="{% url 'adminpanel:category_list' %}" class="mt-4 bg-gray-500 text-white px-6 py-2 rounded-md hover:bg-gray-600">Cancel</a>
        </form>
    </div>
</section>
{% endblock %}
