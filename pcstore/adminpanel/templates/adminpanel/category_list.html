{% extends 'admin.html' %}
{% load static %}
{% block content %}
<section class="py-12 bg-gray-100">
    <div class="container mx-auto px-4">
        <div class="flex justify-between items-center mb-8">
            <h2 class="text-3xl font-bold">Category Management</h2>
            <a href="{% url 'adminpanel:add_category' %}" class="bg-green-500 text-white px-6 py-2 rounded-md hover:bg-green-600">Add Category</a>
        </div>
        <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-8">
            {% for category in categories %}
            <div class="bg-white shadow-md rounded-lg overflow-hidden p-4">
                <h3 class="text-xl font-bold">{{ category.name }}</h3>
                <p class="mt-2 text-gray-600">{{ category.description }}</p>
                {% if category.image %}
                    <img src="{{ category.image.url }}" alt="{{ category.name }}" class="w-full h-auto object-cover mt-4">
                {% else %}
                    <img src="{% static 'images/category_placeholder.png' %}" alt="{{ category.name }}" class="w-full h-auto object-cover mt-4">
                {% endif %}
                <div class="mt-4 flex space-x-2">
                    <a href="{% url 'adminpanel:edit_category' category.id %}" class="bg-yellow-500 text-white px-4 py-2 rounded-md hover:bg-yellow-600">Edit</a>
                    <a href="{% url 'adminpanel:delete_category' category.id %}" class="bg-red-500 text-white px-4 py-2 rounded-md hover:bg-red-600">Delete</a>
                </div>
            </div>
            {% endfor %}
        </div>
    </div>
</section>
{% endblock %}
